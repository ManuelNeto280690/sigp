services:
  mysql:
    image: mysql:8.0
    container_name: sigp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: sigp_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - sigp-network

  sigp-app:
    build:
      context: ./sigp-app
      dockerfile: Dockerfile
    container_name: sigp-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_NAME=SIGP
      - APP_ENV=production
      - APP_DEBUG=true
      - APP_KEY=base64:+jxX29bdmF4tmWlkEjXRPA3pTSv5PhajWkSehOpcZBU=
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sigp_app
      - DB_USERNAME=root
      - DB_PASSWORD=secretpassword
    volumes:
      - ./sigp-app/storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - sigp-network

  sigp-admin:
    build:
      context: ./sigp_admin
      dockerfile: Dockerfile
    container_name: sigp-admin
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      - APP_NAME=SIGP_Admin
      - APP_ENV=production
      - APP_DEBUG=true
      - APP_KEY=base64:+jxX29bdmF4tmWlkEjXRPA3pTSv5PhajWkSehOpcZBU=
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sigp_admin
      - DB_USERNAME=root
      - DB_PASSWORD=secretpassword
    volumes:
      - ./sigp_admin/storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - sigp-network

volumes:
  mysql_data:

networks:
  sigp-network:
    driver: bridge
